name: Linux

on: [push, pull_request]

jobs:
  gcc-build:
    name: 'Linux GCC-${{matrix.version}} ${{matrix.build_type}}'
    # GCC 9 is packaged only up to Ubuntu 24.04; the newer version runs on the current image
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        version: [9, 12]
        include:
          - version: 9
            os: ubuntu-24.04
          - version: 12
            os: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake cmake-data build-essential libgmp-dev gcc-${{matrix.version}} g++-${{matrix.version}}

    - name: Configure
      run: |
        export CC=gcc-${{matrix.version}} CXX=g++-${{matrix.version}}
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
          -DCMAKE_INSTALL_PREFIX=$HOME/sylvan-install \
          -DSYLVAN_GMP=ON

    - name: Build
      run: cmake --build build --config ${{matrix.build_type}}

    - name: Test
      shell: bash
      working-directory: build
      run:  |
        ctest --output-on-failure -C ${{matrix.build_type}} -VV --timeout 30
        examples/simple
        examples/nqueens -w 2 9 | tee /dev/fd/2 | grep -q "352 solutions"
        examples/bddmc ../models/schedule_world.2.bdd -w 2 | tee /dev/fd/2 | grep -q "1570340"
        examples/lddmc ../models/blocks.2.ldd -w 2 | tee /dev/fd/2 | grep -q "7057 states"

    - name: Install
      run: cmake --install build

    - name: Run pkg-config consumer test
      working-directory: test/install/consumer-pkgconfig
      run: |
        export PKG_CONFIG_PATH=$HOME/sylvan-install/lib/pkgconfig
        ./test.sh

    - name: Run CMake consumer test
      working-directory: test/install/consumer-cmake
      run: |
        export CMAKE_PREFIX_PATH=$HOME/sylvan-install
        ./test.sh

  clang-build:
    name: 'Linux CLang-${{matrix.version}} ${{matrix.build_type}}'
    # Clang 15 is packaged only up to Ubuntu 24.04; the newer version runs on the current image
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        version: [15, 19]
        include:
          - version: 15
            os: ubuntu-24.04
          - version: 19
            os: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake cmake-data build-essential libgmp-dev clang-${{matrix.version}}

    - name: Configure
      run: |
        export CC=clang-${{matrix.version}} CXX=clang++-${{matrix.version}}
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
          -DLACE_NATIVE_OPT=OFF \
          -DSYLVAN_GMP=ON

    - name: Build
      run: cmake --build build --config ${{matrix.build_type}}

    - name: Test
      shell: bash
      working-directory: build
      run:  |
        ctest --output-on-failure -C ${{matrix.build_type}} -VV --timeout 30
        examples/nqueens -w 2 9 | tee /dev/fd/2 | grep -q "352 solutions"
        examples/bddmc ../models/schedule_world.2.bdd -w 2 | tee /dev/fd/2 | grep -q "1570340"
        examples/lddmc ../models/blocks.2.ldd -w 2 | tee /dev/fd/2 | grep -q "7057 states"

  diagnostics-build:
    name: 'Linux GCC Release handle checks and GC diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential

    - name: Configure
      env:
        CC: gcc
        CXX: g++
      run: |
        cmake -G Ninja -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DLACE_NATIVE_OPT=OFF \
          -DSYLVAN_BUILD_TESTS=ON \
          -DSYLVAN_BUILD_EXAMPLES=OFF \
          -DSYLVAN_CHECK_HANDLES=ON \
          -DSYLVAN_GC_DIAGNOSTICS=ON

    - name: Build
      run: cmake --build build --parallel 2

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 120

  # Use the current Ubuntu compiler; older versioned compilers above need
  # ubuntu-24.04. GCC ships its sanitizer runtimes with the compiler.
  sanitizer-build:
    name: 'Linux GCC ASan+UBSan'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential libgmp-dev

    - name: Configure
      env:
        CC: gcc
        CXX: g++
      run: |
        cmake -G Ninja -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DLACE_NATIVE_OPT=OFF \
          -DSYLVAN_GMP=ON \
          -DSYLVAN_BUILD_TESTS=ON \
          -DSYLVAN_BUILD_EXAMPLES=ON \
          -DSYLVAN_SANITIZE_ADDRESS=ON \
          -DSYLVAN_SANITIZE_UB=ON

    - name: Build
      run: cmake --build build

    - name: Test
      working-directory: build
      env:
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: ctest --output-on-failure --timeout 1200
